[project]
name = "firewatch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic>=2",
    "pillow",
    "numpy",
    "streamlit",
    "requests",
    "pandas",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.7.2",
    "joblib>=1.6.0",
    "kagglehub>=1.0.2",
    "matplotlib>=3.10.9",
    "ipykernel>=7.3.0",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "lightgbm>=4.7.0",
]

[dependency-groups]
dev = ["httpx"]
train = [
    "kaggle>=1.7.4.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]
